name: Проверка
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    # Зависший тест не должен занимать раннер часами.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Тесты ничего не пушат, токен в .git/config не нужен.
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24.19"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run check-overrides
