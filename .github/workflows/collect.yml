name: Сбор данных
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [overrides.json]
# Права заданы в каждой задаче отдельно: каждая получает только то, что ей нужно.
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    # Зависший источник не должен занимать раннер часами.
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    outputs:
      publish: ${{ steps.collect.outputs.publish }}
    steps:
      # Ничего не пушим, токен в .git/config не нужен.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24.19"
      - name: Состояние прошлого запуска
        uses: actions/cache/restore@v6
        with:
          path: .collector-state
          key: collector-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: collector-state-
      - name: Сбор
        id: collect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node src/main.ts
      - name: Сохранить состояние
        if: always() && hashFiles('.collector-state/state.json') != ''
        uses: actions/cache/save@v6
        with:
          path: .collector-state
          key: collector-state-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Упаковать файл для Pages
        if: always() && steps.collect.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: public
  deploy:
    needs: collect
    if: always() && needs.collect.result != 'cancelled' && needs.collect.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: github-pages
    # Публикация на Pages: только эти два права, больше ничего.
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@v5
